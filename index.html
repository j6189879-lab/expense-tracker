<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e91e63" />
  <meta name="description" content="本地优先的个人开支记录工具" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>记账本</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>记账本</h1>
      <p class="app-subtitle">打开就记，3 秒记一笔</p>
    </header>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <form id="expense-form" class="expense-form" novalidate>
      <label class="field">
        <span class="field-label">金额（元）</span>
        <div class="amount-wrap">
          <span class="currency">¥</span>
          <input
            id="amount"
            class="amount-input"
            type="number"
            inputmode="decimal"
            step="0.01"
            min="0"
            placeholder="0.00"
            autocomplete="off"
            required
          />
        </div>
      </label>

      <fieldset class="field">
        <legend class="field-label">分类</legend>
        <div class="category-group" id="category-group" role="radiogroup" aria-label="分类"></div>
      </fieldset>

      <div class="field-row">
        <label class="field">
          <span class="field-label">日期</span>
          <input id="date" class="date-input" type="date" required />
        </label>

        <label class="field">
          <span class="field-label">备注（可选）</span>
          <input id="note" class="note-input" type="text" placeholder="写点什么…" maxlength="60" />
        </label>
      </div>

      <div id="note-tags" class="note-tags" hidden></div>

      <button type="submit" class="save-btn">保存</button>
    </form>

    <section class="summary">
      <p>当前已记录 <strong id="count">0</strong> 笔</p>
      <div class="data-actions">
        <button type="button" class="export-btn" id="import-btn">导入数据</button>
        <button type="button" class="export-btn" id="export-btn">导出数据</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
      </div>
    </section>

    <section class="summary-card">
      <div class="summary-head">
        <h2 class="section-title">月度汇总</h2>
        <button type="button" class="current-month-btn" id="current-month-btn" hidden>回本月</button>
      </div>
      <div class="month-nav">
        <button type="button" class="month-arrow" id="prev-month" aria-label="上一月">‹</button>
        <span class="month-label" id="month-label"></span>
        <button type="button" class="month-arrow" id="next-month" aria-label="下一月">›</button>
      </div>
      <p class="month-total">总支出 <strong id="month-total">¥0.00</strong></p>
      <div class="category-summary" id="category-summary"></div>
    </section>

    <section class="list-section">
      <h2 class="section-title">流水列表</h2>
      <div class="expense-list" id="expense-list"></div>
      <p class="empty-state" id="empty-state">还没有记录，记下第一笔吧</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
